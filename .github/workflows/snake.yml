# GitHub Action para generar la animación de la serpiente
# de las contribuciones en el perfil de GitHub.
#
# SETUP: Este archivo debe estar en tu repositorio especial
# (Parrilla38/Parrilla38) en .github/workflows/snake.yml

name: Generate Snake Animation

on:
  # Se ejecuta cada 12 horas automáticamente
  schedule:
    - cron: "0 */12 * * *"
  # También se puede ejecutar manualmente
  workflow_dispatch:
  # Se ejecuta al hacer push a main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write

    steps:
      - name: Generate Snake (Dark)
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Parrilla38
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
